<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — القصر الصغير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1e2d;--ink2:#3d5163;--ink3:#7b8c9a;--sea:#00b4d8;--seaD:#0077a8;--seaS:#e3f5fa;--amber:#f2a541;
  --bg:#f3f6f8;--card:#fff;--line:#dde5eb;--ok:#15803d;--okS:#dcfce7;--bad:#b91c1c;--badS:#fee2e2;--warnS:#fef3c7;--r:12px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Tajawal',system-ui,Arial,sans-serif;font-size:15px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--seaD)}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--sea)}
.btn-p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-p:hover{background:#12324a}
.btn-a{background:var(--amber);border-color:var(--amber);color:#1b1206}
.btn-d{color:var(--bad);border-color:#f3c4c4}
.btn-s{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
label{display:block;font-weight:700;font-size:13px;color:var(--ink2);margin:12px 0 5px}
.hint{font-weight:400;color:var(--ink3);font-size:12px}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--seaS)}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.ltr{direction:ltr;text-align:left}
.code{unicode-bidi:plaintext;font-family:ui-monospace,Consolas,monospace;font-size:13px;direction:ltr;text-align:left;min-height:420px;white-space:pre;tab-size:2}
.count{float:inline-end;font-weight:400;font-size:12px;color:var(--ink3)}
.count.bad{color:var(--bad)}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 20%,#0f3b57,#0b1e2d 60%)}
.login-box{width:min(100%,420px);background:#fff;border-radius:20px;padding:30px}
.login-box h1{margin:0 0 4px;font-size:24px}
.login-box p{margin:0 0 10px;color:var(--ink3)}
.login-box .btn-p{width:100%;justify-content:center;margin-top:18px;padding:12px}
.err{background:var(--badS);color:var(--bad);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}

/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--ink);color:#cfe0ea;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .logo{color:#fff;font-weight:800;font-size:18px;padding:4px 12px 18px}
.side .logo small{display:block;font-weight:400;font-size:12px;color:#7fa3b8;direction:ltr;text-align:right}
.side button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center}
.side button:hover{background:#12324a}
.side button[aria-current="page"]{background:var(--sea);color:#04212e;font-weight:800}
.side .spacer{flex:1}
.side a{color:#cfe0ea;padding:10px 12px;text-decoration:none;border-radius:10px}
.side a:hover{background:#12324a}
main{padding:24px clamp(14px,3vw,36px) 120px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:17px}
.muted{color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:780px){#app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}.side .logo,.side .spacer{display:none}.side button,.side a{padding:8px 10px;font-size:14px}.two{grid-template-columns:1fr}}

/* list */
.search{max-width:320px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.thumb{width:72px;height:50px;border-radius:8px;background:var(--seaS) center/cover;display:grid;place-items:center;font-size:20px}
.item h3{margin:0;font-size:16px}
.item .sub{font-size:13px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.dots{display:inline-flex;gap:4px;direction:ltr}
.dot{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--badS);color:var(--bad)}
.dot.on{background:var(--okS);color:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warnS);color:#92400e}
.score{font-weight:800}
.score.g{color:var(--ok)}.score.m{color:#b45309}.score.b{color:var(--bad)}
@media (max-width:620px){.item{grid-template-columns:56px 1fr}.item .acts{grid-column:1/-1}.thumb{width:56px}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 12px;padding:0 4px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;border-bottom:3px solid transparent;font-weight:700;color:var(--ink3);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--sea)}
.tabs .ok{color:var(--ok)}.tabs .no{color:var(--bad)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.toolbar .btn{font-size:12px;padding:4px 10px}

/* images */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.img{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--seaS)}
.img .bar{display:flex;gap:4px;padding:6px;flex-wrap:wrap}
.img .bar .btn{font-size:11px;padding:3px 8px}
.img .name{font-size:11px;color:var(--ink3);padding:0 6px 6px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-prev{width:100%;aspect-ratio:16/9;border-radius:10px;background:var(--seaS) center/cover;display:grid;place-items:center;color:var(--ink3);border:1px dashed var(--line)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);cursor:pointer}
.drop.over{border-color:var(--sea);background:var(--seaS)}

/* seo */
.seo-score{font-size:30px;font-weight:800}
.checks{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.checks li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border:0}
.gpreview{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#fff}
.gpreview .u{font-size:12px;color:#1e6b33;direction:ltr;text-align:left}
.gpreview .t{color:#1a0dab;font-size:17px;line-height:1.3;margin:2px 0}
.gpreview .d{font-size:13px;color:#4d5156}

/* repeatable rows */
.rep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfdfe}
.rep .rep-h{display:flex;gap:6px;justify-content:space-between;align-items:center}
.l4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.l4 .lab{font-size:11px;color:var(--ink3);font-weight:800;margin-bottom:2px}
@media (max-width:900px){.l4{grid-template-columns:1fr 1fr}}

/* publish bar + toast + modal */
.pubbar{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:781px){.pubbar{inset-inline-start:230px}}
.pubbar .status{margin-inline-end:auto;color:var(--ink3);font-size:14px}
.toast{position:fixed;top:16px;inset-inline-start:50%;transform:translateX(50%);z-index:100;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
[dir=ltr] .toast{transform:translateX(-50%)}
.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,15,25,.6);display:grid;grid-template-rows:auto 1fr;padding:16px}
.modal .mh{display:flex;gap:8px;align-items:center;background:#fff;padding:10px 14px;border-radius:12px 12px 0 0;flex-wrap:wrap}
.modal iframe{width:100%;height:100%;border:0;background:#fff;border-radius:0 0 12px 12px;justify-self:center;transition:max-width .2s}
.progress{height:4px;background:var(--seaS);border-radius:4px;overflow:hidden;width:120px}
.progress i{display:block;height:100%;width:40%;background:var(--sea);animation:pr 1s infinite linear}
@keyframes pr{from{transform:translateX(250%)}to{transform:translateX(-100%)}}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="login-form" autocomplete="off">
    <h1>لوحة التحكم</h1>
    <p>القصر الصغير — ksarsghir.com</p>
    <label for="f-repo">الريبو <span class="hint">(حساب/اسم)</span></label>
    <input type="text" id="f-repo" class="ltr" value="elhichoubilal/ksarsghir" required>
    <label for="f-branch">الفرع</label>
    <input type="text" id="f-branch" class="ltr" value="main" required>
    <label for="f-token">GitHub Token</label>
    <input type="password" id="f-token" class="ltr" placeholder="ghp_… أو github_pat_…" required>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="f-remember"> تذكرني فهاد الجهاز</label>
    <button class="btn btn-p" type="submit">دخول</button>
    <div class="err" id="login-err" hidden></div>
    <p class="hint" style="margin-top:14px">الـ Token كيتخزن غير فهاد المتصفح، وما كيترفع لأي مكان.</p>
  </form>
</section>

<div id="app" hidden>
  <nav class="side" aria-label="الأقسام">
    <div class="logo">القصر الصغير<small id="side-repo"></small></div>
    <button data-view="articles">📝 المواضيع</button>
    <button data-view="home">🏠 الصفحة الرئيسية</button>
    <button data-view="links">🔗 القائمة والروابط</button>
    <button data-view="images">🖼️ الصور</button>
    <button data-view="settings">⚙️ الإعدادات</button>
    <div class="spacer"></div>
    <a id="site-link" href="#" target="_blank" rel="noopener">↗ عرض الموقع</a>
    <button id="logout">🚪 خروج</button>
  </nav>
  <main id="view" tabindex="-1"></main>
  <div class="pubbar" id="pubbar">
    <span class="status" id="status">جاهز</span>
    <button class="btn btn-a" id="publish-btn" type="button">🚀 نشر التغييرات</button>
  </div>
</div>
<input type="file" id="file-pick" accept="image/*" multiple hidden>

<script src="build.js"></script>
<script>
(function(){
'use strict';
var B = window.KSBuild, LANGS = B.LANGS;
var LN = {ar:'العربية',fr:'Français',en:'English',es:'Español'};
var S = {repo:'',branch:'main',token:'',site:null,articles:[],manifest:{files:[]},css:'',dirty:false,imgCache:{},view:'articles',editing:null,editLang:'ar',homeLang:'ar'};
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return B.esc(s);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},bad?6000:3000);}
function setStatus(html){$('#status').innerHTML=html;}
function markDirty(){S.dirty=true;setStatus('⚠️ عندك تغييرات ما تنشراتش');}
window.addEventListener('beforeunload',function(e){if(S.dirty){e.preventDefault();e.returnValue='';}});

/* ---------- GitHub API ---------- */
function gh(path,o){
  o=o||{};
  var h={'Authorization':'Bearer '+S.token,'Accept':o.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(o.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+S.repo+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:'no-store'})
    .then(function(r){
      if(r.status===404&&o.allow404)return null;
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){
        var m=j.message||'';
        if(r.status===401)m='الـ Token غالط ولا سالا (401)';
        else if(r.status===403)m='ما عندكش الصلاحية (403). تأكد أن الـ Token فيه صلاحية repo / Contents: write. '+m;
        else if(r.status===404)m='ما لقيناش: '+path+' (404)';
        throw new Error(m||('HTTP '+r.status));});
      if(o.raw)return r.text();
      return r.status===204?null:r.json();
    });
}
function encPath(p){return p.split('/').map(encodeURIComponent).join('/');}
function readFile(p){return gh('/contents/'+encPath(p)+'?ref='+encodeURIComponent(S.branch),{accept:'application/vnd.github.raw+json',raw:true,allow404:true});}
function rawUrl(p){return 'https://raw.githubusercontent.com/'+S.repo+'/'+S.branch+'/'+encPath(p);}
function pagesUrl(){var p=S.repo.split('/');return 'https://'+p[0].toLowerCase()+'.github.io/'+p[1]+'/';}
function imgSrc(p){if(!p)return '';if(/^(https?:|data:)/.test(p))return p;return S.imgCache[p]||rawUrl(p);}

async function commit(files,deletes,message){
  var ref=await gh('/git/ref/heads/'+S.branch);
  var head=ref.object.sha;
  var c=await gh('/git/commits/'+head);
  var tree=[];
  Object.keys(files).forEach(function(p){tree.push({path:p,mode:'100644',type:'blob',content:files[p]});});
  if(deletes&&deletes.length){
    var existing=await gh('/git/trees/'+c.tree.sha+'?recursive=1');
    var have={};(existing.tree||[]).forEach(function(e){have[e.path]=1;});
    deletes.forEach(function(p){if(have[p])tree.push({path:p,mode:'100644',type:'blob',sha:null});});
  }
  var nt=await gh('/git/trees',{method:'POST',body:{base_tree:c.tree.sha,tree:tree}});
  var nc=await gh('/git/commits',{method:'POST',body:{message:message,tree:nt.sha,parents:[head]}});
  await gh('/git/refs/heads/'+S.branch,{method:'PATCH',body:{sha:nc.sha}});
  return nc.sha;
}

/* ---------- login ---------- */
function tryAuto(){
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('ks-admin')||sessionStorage.getItem('ks-admin')||'null');}catch(e){}
  if(saved&&saved.token){S.repo=saved.repo;S.branch=saved.branch||'main';S.token=saved.token;start();}
}
$('#login-form').addEventListener('submit',function(e){
  e.preventDefault();
  S.repo=$('#f-repo').value.trim().replace(/^https:\/\/github.com\//,'').replace(/\/$/,'');
  S.branch=$('#f-branch').value.trim()||'main';
  S.token=$('#f-token').value.trim();
  var data=JSON.stringify({repo:S.repo,branch:S.branch,token:S.token});
  try{($('#f-remember').checked?localStorage:sessionStorage).setItem('ks-admin',data);}catch(err){}
  start();
});
$('#logout').addEventListener('click',function(){
  if(S.dirty&&!confirm('عندك تغييرات ما تنشراتش. تخرج؟'))return;
  try{localStorage.removeItem('ks-admin');sessionStorage.removeItem('ks-admin');}catch(e){}
  S.dirty=false;location.reload();
});

async function start(){
  var err=$('#login-err');err.hidden=true;
  var btn=$('#login-form .btn-p');btn.disabled=true;btn.textContent='كنتحقق…';
  try{
    await gh('');
    var r=await Promise.all([readFile('data/site.json'),readFile('data/articles.json'),readFile('data/manifest.json'),readFile('assets/style.css')]);
    if(!r[0]||!r[1])throw new Error('ما لقيناش data/site.json ولا data/articles.json فالريبو. ارفع ملفات الموقع أولاً.');
    S.site=JSON.parse(r[0]);S.articles=JSON.parse(r[1]).articles||[];
    S.manifest=r[2]?JSON.parse(r[2]):{files:[]};S.css=r[3]||'';
    $('#login').hidden=true;$('#app').hidden=false;
    $('#side-repo').textContent=S.repo;
    $('#site-link').href=pagesUrl();
    go('articles');
  }catch(e){
    err.textContent='❌ '+e.message;err.hidden=false;$('#login').hidden=false;$('#app').hidden=true;
    try{localStorage.removeItem('ks-admin');sessionStorage.removeItem('ks-admin');}catch(x){}
  }finally{btn.disabled=false;btn.textContent='دخول';}
}

/* ---------- navigation ---------- */
$$('.side [data-view]').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.view);});});
function go(v,arg){
  S.view=v;
  var ov=$('#view'),nv=ov.cloneNode(false);ov.replaceWith(nv);
  $$('.side [data-view]').forEach(function(b){b.toggleAttribute('aria-current',b.dataset.view===v||(v==='edit'&&b.dataset.view==='articles'));if(b.hasAttribute('aria-current'))b.setAttribute('aria-current','page');});
  var views={articles:viewArticles,edit:viewEdit,home:viewHome,links:viewLinks,images:viewImages,settings:viewSettings};
  views[v](arg);
  window.scrollTo(0,0);
}

/* ---------- helpers for forms ---------- */
function field(label,html,hint){return '<label>'+label+(hint?' <span class="hint">'+hint+'</span>':'')+'</label>'+html;}
function l4(obj,key,multiline){
  obj=obj||{};
  return '<div class="l4">'+LANGS.map(function(l){
    var v=esc(obj[l]||'');
    return '<div><div class="lab">'+l.toUpperCase()+'</div>'+(multiline?'<textarea data-k="'+key+'" data-l="'+l+'" dir="'+(l==='ar'?'rtl':'ltr')+'">'+v+'</textarea>':'<input type="text" data-k="'+key+'" data-l="'+l+'" dir="'+(l==='ar'?'rtl':'ltr')+'" value="'+v+'">')+'</div>';
  }).join('')+'</div>';
}
function readL4(root,key){var o={};$$('[data-k="'+key+'"]',root).forEach(function(i){o[i.dataset.l]=i.value.trim();});return o;}
function slugify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);}
function today(){return new Date().toISOString().slice(0,10);}
function avgScore(a){var s=0,n=0;LANGS.forEach(function(l){if(B.hasLang(a,l)){s+=B.seoCheck(S.site,a,l).score;n++;}});return n?Math.round(s/n):0;}
function scoreCls(s){return s>=80?'g':s>=55?'m':'b';}
function catOptions(sel){return (S.site.categories||[]).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc((c.icon||'')+' '+(c.name.ar||c.id))+'</option>';}).join('');}

/* ---------- clean pasted HTML ---------- */
function cleanContent(html){
  html=String(html||'');
  var m=html.match(/<body[^>]*>([\s\S]*)<\/body>/i);if(m)html=m[1];
  html=html.replace(/<(script|style|noscript)[\s\S]*?<\/\1>/gi,'').replace(/<(link|meta|title|base)[^>]*>/gi,'')
    .replace(/<h1([^>]*)>/gi,'<h2$1>').replace(/<\/h1>/gi,'</h2>').replace(/\son\w+="[^"]*"/gi,'').replace(/javascript:/gi,'');
  return html.trim();
}

/* ---------- image upload ---------- */
function compress(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type))return rej(new Error('هادا ماشي ملف صورة'));
    if(file.type==='image/gif'||file.type==='image/svg+xml'){var fr=new FileReader();fr.onload=function(){res({data:fr.result,ext:file.type==='image/gif'?'gif':'svg'});};fr.readAsDataURL(file);return;}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight;
      if(w>max){h=Math.round(h*max/w);w=max;}
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      var d=c.toDataURL('image/webp',0.82),ext='webp';
      if(d.indexOf('data:image/webp')!==0){d=c.toDataURL('image/jpeg',0.85);ext='jpg';}
      res({data:d,ext:ext});
    };
    img.onerror=function(){rej(new Error('ما قدرناش نقراو الصورة'));};
    img.src=url;
  });
}
async function uploadImage(file,prefix){
  var r=await compress(file);
  var base=slugify(prefix||file.name.replace(/\.[^.]+$/,''))||'img';
  var path='assets/img/'+base+'-'+Date.now().toString(36)+'.'+r.ext;
  await gh('/contents/'+encPath(path),{method:'PUT',body:{message:'🖼️ رفع صورة: '+path,content:r.data.split(',')[1],branch:S.branch}});
  S.imgCache[path]=r.data;
  return path;
}
function pickImages(multi,prefix){
  return new Promise(function(res){
    var inp=$('#file-pick');inp.multiple=!!multi;inp.value='';
    inp.onchange=async function(){
      var files=Array.prototype.slice.call(inp.files||[]),out=[];
      for(var i=0;i<files.length;i++){
        setStatus('<span class="progress"><i></i></span> كنرفع الصورة '+(i+1)+' / '+files.length+'…');
        try{out.push(await uploadImage(files[i],prefix));}catch(e){toast('❌ '+e.message,true);}
      }
      setStatus(S.dirty?'⚠️ عندك تغييرات ما تنشراتش':'جاهز');
      if(out.length)toast('✅ ترفعات '+out.length+' صورة');
      res(out);
    };
    inp.click();
  });
}

function preview(a,lang){

  var arts=S.articles.filter(function(x){return x.slug!==a.slug;}).concat([a]);
  var html=B.articlePage(S.site,arts,a,lang);

  html=html.replace(/<link rel="stylesheet"[^>]*>/,'<style>'+S.css+'</style>').replace(/<script src="[^"]*site\.js[^"]*"[^>]*><\/script>/,'')
    .replace('<head>','<head><base href="'+base+'" target="_blank">');

/* ---- image library ---- */
async function listImages(){
  var r=await gh('/contents/assets/img?ref='+encodeURIComponent(S.branch),{allow404:true});
  return (r||[]).filter(function(f){return f.type==='file'&&/\.(webp|jpe?g|png|gif|svg|avif)$/i.test(f.name);}).sort(function(x,y){return y.name.localeCompare(x.name);});
}
function chooseFromLibrary(multi){
  return new Promise(async function(res){
    var m=document.createElement('div');m.className='modal';
    m.innerHTML='<div class="mh"><b>مكتبة الصور</b><span style="flex:1"></span>'+(multi?'<button class="btn btn-s btn-p" data-ok>إضافة المختارة</button>':'')+'<button class="btn btn-s" data-close>إغلاق</button></div><div style="background:#fff;padding:14px;overflow:auto;border-radius:0 0 12px 12px"><div class="imgs" id="lib">كنحمل…</div></div>';
    document.body.appendChild(m);

    try{
      var files=await listImages();
      m.querySelector('#lib').innerHTML=files.length?files.map(function(f){return '<button class="img" style="all:unset;cursor:pointer;display:block;border:2px solid var(--line);border-radius:10px;overflow:hidden" data-p="'+esc(f.path)+'"><img src="'+esc(imgSrc(f.path))+'" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"></button>';}).join(''):'<p class="hint">المكتبة خاوية. رفع الصور من قسم "الصور".</p>';
    }catch(e){m.querySelector('#lib').textContent='❌ '+e.message;}

      var p=e.target.closest('[data-p]');
      if(p){if(!multi){m.remove();return res([p.dataset.p]);}var i=sel.indexOf(p.dataset.p);if(i>=0){sel.splice(i,1);p.style.borderColor='';}else{sel.push(p.dataset.p);p.style.borderColor='var(--sea)';}}

  });
}

/* ---------- publish ---------- */
var publishing=false;
async function publish(message){
  if(publishing)return false;
  publishing=true;var btn=$('#publish-btn');btn.disabled=true;
  setStatus('<span class="progress"><i></i></span> كنبني الصفحات…');
  try{
    var files=B.buildAll(S.site,S.articles);
    var list=Object.keys(files).sort();
    var deletes=(S.manifest.files||[]).filter(function(p){return !files[p];});
    files['data/site.json']=JSON.stringify(S.site,null,1);
    files['data/articles.json']=JSON.stringify({articles:S.articles},null,1);
    files['data/manifest.json']=JSON.stringify({files:list},null,1);
    setStatus('<span class="progress"><i></i></span> كنرفع '+Object.keys(files).length+' ملف لـ GitHub…');
    var sha=await commit(files,deletes,message||'📝 تحديث الموقع');
    S.manifest={files:list};S.dirty=false;
    toast('✅ تنشر! غادي يبان فالموقع خلال دقيقة تقريباً.');
    watchDeploy(sha);
    return true;
  }catch(e){
    setStatus('❌ ما تنشرش');toast('❌ '+e.message,true);return false;
  }finally{publishing=false;btn.disabled=false;}
}
async function watchDeploy(sha){
  var t0=Date.now();
  setStatus('<span class="progress"><i></i></span> GitHub Pages كيحدّث الموقع…');
  while(Date.now()-t0<240000){
    await new Promise(function(r){setTimeout(r,6000);});
    try{
      var b=await gh('/pages/builds/latest');
      if(b&&b.commit===sha&&b.status==='built'){setStatus('✅ الموقع محدّث · <a href="'+pagesUrl()+'" target="_blank" rel="noopener">عرض</a>');return;}
      if(b&&b.commit===sha&&b.status==='errored'){setStatus('❌ GitHub Pages ما قدرش يبني الموقع');return;}
    }catch(e){break;}
  }
  setStatus('✅ تنشر · التحديث كياخد حتى دقيقتين');
}
$('#publish-btn').addEventListener('click',function(){
  if(S.view==='edit'){$('#save').click();return;}
  publish('📝 تحديث الموقع');
});

tryAuto();
})();
</script>
