name: Live weather cache

# Every hour GitHub fetches the weather and sea data from Open-Meteo
# and saves it in data/live/, so visitors read it from the site itself.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Open-Meteo
        run: |
          node <<'JS'
          const fs = require('fs');
          let live = {};
          try { live = JSON.parse(fs.readFileSync('data/site.json', 'utf8')).live || {}; } catch (e) {}
          const lat = live.lat || 35.8426, lng = live.lng || -5.5596;
          const seaLat = live.seaLat || 35.87, seaLng = live.seaLng || -5.55;
          const off = +live.utcOffset || 0;
          const tz = off === 0 ? 'UTC' : 'Etc/GMT' + (off > 0 ? '-' : '+') + Math.abs(off);
          const FC = '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day' +
            '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day,visibility' +
            '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset,uv_index_max,daylight_duration' +
            '&forecast_days=7&timezone=' + encodeURIComponent(tz);
          const MR = '&current=wave_height,wave_period,wave_direction,sea_surface_temperature' +
            '&hourly=wave_height,wave_period,sea_surface_temperature,sea_level_height_msl&daily=wave_height_max' +
            '&forecast_days=7&timezone=' + encodeURIComponent(tz);
          const jobs = {
            'fc-town': 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng + FC,
            'fc-sea': 'https://api.open-meteo.com/v1/forecast?latitude=' + seaLat + '&longitude=' + seaLng + FC,
            'mar-sea': 'https://marine-api.open-meteo.com/v1/marine?latitude=' + seaLat + '&longitude=' + seaLng + MR
          };
          (async () => {
            fs.mkdirSync('data/live', { recursive: true });
            for (const [name, url] of Object.entries(jobs)) {
              let ok = false;
              for (let i = 0; i < 3 && !ok; i++) {
                try {
                  const r = await fetch(url);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const j = await r.json();
                  j._fetched = new Date().toISOString(); j._tz = tz; j._lat = name === 'fc-town' ? lat : seaLat;
                  fs.writeFileSync('data/live/' + name + '.json', JSON.stringify(j));
                  ok = true; console.log('ok', name);
                } catch (e) { console.log('retry', name, e.message); await new Promise(r => setTimeout(r, 4000)); }
              }
              if (!ok) console.log('kept old file for', name);
            }
          })();
          JS

      - name: Save
        run: |
          git config user.name "ksarsghir-weather"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "🌤️ تحديث الطقس والبحر"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 6; done
          exit 1
